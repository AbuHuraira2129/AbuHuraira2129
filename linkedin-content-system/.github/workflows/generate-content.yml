name: Generate content (weekly)

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      brief:
        description: "Topic or angle for this batch (optional)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-content-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate drafts
        run: npm run generate -- --brief "${{ inputs.brief }}" --count 3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Push drafts to Notion approval queue
        run: npm run push:notion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CONTENT_DATA_SOURCE_ID: ${{ secrets.NOTION_CONTENT_DATA_SOURCE_ID }}
      - name: Sync approval decisions back from Notion
        run: npm run sync:notion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
